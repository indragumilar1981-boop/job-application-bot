<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Bot - Lowongan Terdeteksi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      min-height: 500px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      color: #f8fafc;
      font-size: 13px;
    }

    /* HEADER */
    .header {
      background: rgba(99, 102, 241, 0.15);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      font-size: 22px;
    }

    .header-text h2 {
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .header-text p {
      font-size: 11px;
      color: #64748b;
    }

    .badge-count {
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white;
      font-weight: 700;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 9999px;
      min-width: 28px;
      text-align: center;
    }

    /* TABS */
    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.2);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #818cf8;
      border-bottom-color: #818cf8;
    }

    /* BULK ACTIONS */
    .bulk-actions {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(99,102,241,0.05);
    }

    .btn-add-all {
      flex: 1;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-add-all:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-clear {
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover { background: rgba(239,68,68,0.25); }

    .btn-open-bot {
      background: rgba(16,185,129,0.15);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-open-bot:hover { background: rgba(16,185,129,0.25); }

    /* JOB LIST */
    .job-list {
      max-height: 340px;
      overflow-y: auto;
    }

    .job-list::-webkit-scrollbar { width: 4px; }
    .job-list::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 4px; }

    .job-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: background 0.15s;
    }

    .job-item:hover { background: rgba(255,255,255,0.03); }

    .job-item.added { opacity: 0.5; }

    .job-source-icon {
      font-size: 20px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .job-info {
      flex: 1;
      min-width: 0;
    }

    .job-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-company {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .job-meta {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .job-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.07);
      color: #94a3b8;
    }

    .job-tag.source-linkedin { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .job-tag.source-jobstreet { background: rgba(249,115,22,0.15); color: #fb923c; }

    .job-email {
      font-size: 10px;
      color: #34d399;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-add-job {
      flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white;
      border: none;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-add-job:hover { opacity: 0.85; transform: scale(1.05); }
    .btn-add-job.added { background: rgba(16,185,129,0.2); color: #34d399; cursor: default; }
    .btn-add-job:disabled { opacity: 0.5; cursor: not-allowed; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon { font-size: 40px; margin-bottom: 12px; }

    .empty-state h3 {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }

    .portals-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .portal-link {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px 12px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .portal-link:hover {
      background: rgba(99,102,241,0.15);
      color: #a5b4fc;
      border-color: rgba(99,102,241,0.3);
    }

    /* FOOTER */
    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.2);
    }

    .footer-status {
      font-size: 11px;
      color: #64748b;
    }

    .pulse-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 2s ease-in-out infinite;
      margin-right: 4px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* NOTIF TOAST */
    .toast {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      z-index: 9999;
      animation: toastIn 0.3s ease;
      display: none;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">
      <span class="header-icon">🤖</span>
      <div class="header-text">
        <h2>Job Bot Detector</h2>
        <p>Lowongan dari LinkedIn & Jobstreet</p>
      </div>
    </div>
    <span class="badge-count" id="totalCount">0</span>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" id="tabDetected" data-tab="detected">
      🔍 Terdeteksi (<span id="tabDetectedCount">0</span>)
    </button>
    <button class="tab-btn" id="tabAdded" data-tab="added">
      ✅ Ditambahkan (<span id="tabAddedCount">0</span>)
    </button>
  </div>

  <!-- BULK ACTIONS -->
  <div class="bulk-actions" id="bulkActions">
    <button class="btn-add-all" id="btnAddAll">➕ Tambahkan Semua ke Bot</button>
    <button class="btn-clear" id="btnClear">🗑️ Hapus</button>
    <a class="btn-open-bot" id="btnOpenBot" href="#" target="_blank">🚀 Buka Bot</a>
  </div>

  <!-- JOB LIST -->
  <div class="job-list" id="jobList"></div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-status">
      <span class="pulse-dot"></span>
      Aktif di LinkedIn & Jobstreet
    </span>
    <span style="font-size:11px;color:#64748b;" id="lastScan">-</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
